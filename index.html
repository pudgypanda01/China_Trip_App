<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sichuan Trip">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Sichuan 2026</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #141414;
    --bg-card: #1a1a1a;
    --bg-card-hover: #222222;
    --gold: #b8a99a;
    --gold-light: #cec2b5;
    --gold-dim: #998b7c;
    --text-primary: #f2efe9;
    --text-secondary: #a09a93;
    --text-muted: #5e5955;
    --accent: #b8a99a;
    --accent-soft: rgba(184,169,154,0.1);
    --border: rgba(255,255,255,0.06);
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
    --radius: 14px;
    --radius-sm: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Background gradient */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 40vh;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.02) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding-top: var(--safe-top);
    background: rgba(10,10,10,0.88);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    backdrop-filter: blur(24px) saturate(150%);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    padding: 16px 20px 0;
  }

  .trip-title {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .trip-subtitle {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 300;
    margin-bottom: 14px;
  }

  /* Day selector */
  .day-selector {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 0 20px 14px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .day-selector::-webkit-scrollbar { display: none; }

  .day-tab {
    flex-shrink: 0;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 54px;
    padding: 8px 6px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1.5px solid transparent;
    color: var(--text-muted);
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .day-tab .day-num {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
  }

  .day-tab .day-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .day-tab.active {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.12);
    color: var(--text-primary);
  }

  .day-tab:not(.active):active {
    background: rgba(255,255,255,0.05);
    transform: scale(0.95);
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding-bottom: var(--safe-bottom);
    background: rgba(10,10,10,0.92);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    backdrop-filter: blur(24px) saturate(150%);
    border-top: 1px solid var(--border);
    display: flex;
  }

  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 10px 0 8px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.2s;
  }

  .nav-btn .nav-icon {
    font-size: 22px;
    line-height: 1;
  }

  .nav-btn.active {
    color: var(--text-primary);
  }

  /* Monotone emoji treatment */
  .card-emoji,
  .nav-icon,
  .hero-emoji,
  .stat-emoji,
  .loading-logo {
    filter: grayscale(1) brightness(0.85) contrast(1.1);
    opacity: 0.7;
  }

  /* Main content */
  .main {
    position: relative;
    z-index: 1;
    padding-bottom: calc(70px + var(--safe-bottom));
  }

  /* Day content */
  .day-content {
    padding: 20px 16px;
    display: none;
    animation: fadeIn 0.35s ease;
  }

  .day-content.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .day-header {
    margin-bottom: 20px;
  }

  .day-header h1 {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    line-height: 1.15;
  }

  .day-header .day-date {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .day-header .day-summary {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
    line-height: 1.5;
  }

  /* Activity cards */
  .activity-card {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .activity-card:active {
    transform: scale(0.98);
    background: var(--bg-card-hover);
  }

  .activity-card::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 80px;
    height: 100%;
    background: none;
    pointer-events: none;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .card-emoji {
    font-size: 24px;
    line-height: 1;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
  }

  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-time {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.45;
  }

  .card-location {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .card-location svg {
    width: 14px;
    height: 14px;
    opacity: 0.6;
    flex-shrink: 0;
  }

  .card-search-hint {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.25;
  }

  .card-search-hint svg {
    width: 16px;
    height: 16px;
    color: var(--text-muted);
  }

  /* Accommodations page */
  .accommodations {
    padding: 20px 16px;
    display: none;
    animation: fadeIn 0.35s ease;
  }

  .accommodations.active {
    display: block;
  }

  .accommodations h1 {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .accommodations .section-sub {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    font-weight: 300;
    margin-bottom: 24px;
  }

  .hotel-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .hotel-card:active {
    transform: scale(0.98);
    background: var(--bg-card-hover);
  }

  .hotel-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 0 2px 2px 0;
  }

  .hotel-dates {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .hotel-name {
    font-size: 17px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .hotel-room {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .hotel-nights {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .hotel-perks {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .perk-tag {
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    color: var(--text-secondary);
    font-weight: 400;
    letter-spacing: 0.3px;
  }

  /* Overview page */
  .overview-page {
    padding: 20px 16px;
    display: none;
    animation: fadeIn 0.35s ease;
  }

  .overview-page.active {
    display: block;
  }

  .overview-page h1 {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .overview-page .section-sub {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    font-weight: 300;
    margin-bottom: 24px;
  }

  .overview-hero {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    margin-bottom: 20px;
    text-align: center;
  }

  .overview-hero .hero-emoji {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .overview-hero h2 {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .overview-hero p {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    text-align: center;
  }

  .stat-card .stat-emoji {
    font-size: 24px;
    margin-bottom: 6px;
  }

  .stat-card .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .stat-card .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .countdown-banner {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    text-align: center;
    margin-bottom: 20px;
  }

  .countdown-banner .countdown-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 400;
    margin-bottom: 4px;
  }

  .countdown-banner .countdown-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .countdown-banner .countdown-unit {
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* During trip state */
  .countdown-banner.during {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
  }

  .countdown-banner.during .countdown-value {
    color: var(--text-primary);
  }

  .countdown-banner.past {
    background: rgba(255,255,255,0.02);
    border-color: var(--border);
  }

  .countdown-banner.past .countdown-value {
    color: var(--text-muted);
  }

  /* Swipe container */
  .swipe-container {
    touch-action: pan-y;
    overflow: hidden;
  }

  /* Loading state */
  .loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.4s ease;
  }

  .loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-text {
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--text-secondary);
    font-weight: 300;
    margin-top: 16px;
  }

  .loading-logo {
    font-size: 56px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.7; }
  }

  /* Page transitions */
  .page-view {
    min-height: calc(100vh - 140px);
    min-height: calc(100dvh - 140px);
  }

  /* Scroll to top */
  .main::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="loading-logo">🏔️</div>
  <div class="loading-text">Sichuan 2026</div>
</div>

<header class="header">
  <div class="header-inner">
    <div class="trip-title">Sichuan, China</div>

<main class="main" id="mainContent">
  <div class="page-view" id="itineraryView">
    <div class="swipe-container" id="swipeContainer"></div>
  </div>
  <div class="page-view accommodations" id="accommodationsView"></div>
  <div class="page-view overview-page" id="overviewView"></div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="itinerary" id="navItinerary">

  </button>
</nav>

// ─── APP STATE ──────────────────────────────────────────────────────────────

let currentDay = 0; // 0-indexed
let currentView = 'itinerary'; // 'itinerary' | 'accommodations' | 'overview'
let touchStartX = 0;
let touchEndX = 0;
let isSwiping = false;

// ─── INITIALIZATION ─────────────────────────────────────────────────────────

function init() {
  // Determine which day to show
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const tripStart = new Date(2026, 3, 22);
  tripStart.setHours(0, 0, 0, 0);
  const tripEnd = new Date(2026, 3, 29);
  tripEnd.setHours(23, 59, 59, 999);

  if (today >= tripStart && today <= tripEnd) {
    const diffDays = Math.floor((today - tripStart) / (1000 * 60 * 60 * 24));
    currentDay = Math.min(diffDays, 7);
  } else {
    currentDay = 0;
  }

  renderDaySelector();
  renderAllDays();
  renderAccommodations();
  renderOverview();
  setActiveDay(currentDay);
  setupSwipe();
  setupNavigation();

  // Hide loading screen
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 600);
}

// ─── RENDER FUNCTIONS ───────────────────────────────────────────────────────

function renderDaySelector() {
  const selector = document.getElementById('daySelector');
  selector.innerHTML = DAYS.map((d, i) => `
    <button class="day-tab${i === currentDay ? ' active' : ''}" data-day="${i}" aria-label="Day ${d.day}">
      <span class="day-num">${d.day}</span>
      <span class="day-label">${d.dayName}</span>
    </button>
  `).join('');

  selector.addEventListener('click', (e) => {
    const tab = e.target.closest('.day-tab');
    if (tab) {
      const dayIdx = parseInt(tab.dataset.day);
      setActiveDay(dayIdx);
    }
  });
}

function renderAllDays() {
  const container = document.getElementById('swipeContainer');
  container.innerHTML = DAYS.map((d, i) => `
    <div class="day-content${i === currentDay ? ' active' : ''}" data-day-content="${i}">
      <div class="day-header">
        <h1>Day ${d.day}</h1>
        <div class="day-date">${d.date}</div>
        <div class="day-summary">${d.summary}</div>
      </div>
      ${d.activities.map(a => renderActivityCard(a)).join('')}
    </div>
  `).join('');
}

function renderActivityCard(activity) {
  const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(activity.search)}`;
  return `
    <a class="activity-card" href="${searchUrl}" target="_blank" rel="noopener noreferrer">
      <div class="card-search-hint">${SEARCH_ICON}</div>
      <div class="card-top">
        <div class="card-emoji">${activity.emoji}</div>
        <div class="card-body">
          ${activity.time ? `<div class="card-time">${activity.time}</div>` : ''}
          <div class="card-title">${activity.title}</div>
          ${activity.desc ? `<div class="card-desc">${activity.desc}</div>` : ''}
          ${activity.location ? `<div class="card-location">${LOCATION_ICON} ${activity.location}</div>` : ''}

  `;
}

// ─── DAY NAVIGATION ─────────────────────────────────────────────────────────

function setActiveDay(idx) {
  currentDay = idx;

  // Update tabs
  document.querySelectorAll('.day-tab').forEach((tab, i) => {
    tab.classList.toggle('active', i === idx);
  });

  // Update content
  document.querySelectorAll('.day-content').forEach((content, i) => {
    content.classList.toggle('active', i === idx);
  });

  // Scroll active tab into view
  const activeTab = document.querySelector(`.day-tab[data-day="${idx}"]`);
  if (activeTab) {
    activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  // Scroll main content to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── SWIPE HANDLING ─────────────────────────────────────────────────────────

function setupSwipe() {
  const container = document.getElementById('swipeContainer');

  container.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    isSwiping = true;
  }, { passive: true });

  container.addEventListener('touchend', (e) => {
    if (!isSwiping) return;
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
    isSwiping = false;
  }, { passive: true });
}

function handleSwipe() {
  const diff = touchStartX - touchEndX;
  const threshold = 60;

  if (Math.abs(diff) < threshold) return;

  if (diff > 0 && currentDay < DAYS.length - 1) {
    // Swipe left → next day
    setActiveDay(currentDay + 1);
  } else if (diff < 0 && currentDay > 0) {
    // Swipe right → prev day
    setActiveDay(currentDay - 1);
  }
}

// ─── BOTTOM NAVIGATION ─────────────────────────────────────────────────────

function setupNavigation() {
  const navBtns = document.querySelectorAll('.nav-btn');
  navBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const view = btn.dataset.view;
      switchView(view);
    });
  });
}

function switchView(view) {
  currentView = view;

  // Update nav buttons
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });

  // Update visible pages
  document.getElementById('itineraryView').style.display = view === 'itinerary' ? 'block' : 'none';
  document.getElementById('accommodationsView').classList.toggle('active', view === 'accommodations');
  document.getElementById('overviewView').classList.toggle('active', view === 'overview');

  // Show/hide day selector
  document.getElementById('daySelector').style.display = view === 'itinerary' ? 'flex' : 'none';

  // Scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      // Service worker registration failed — app still works
    });
  });
}
